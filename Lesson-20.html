<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript String Methods</h2>
    <p>Basic Methods</p>
    <script>
        var str = "AmAzInG" ;
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith('a'));
        document.write("<br>");
        
 // Test Method -> returns true or false 
 var str1 ="I learnt about Methods";
 var patt = new RegExp("xyz");
 var res = patt.test(str1);
 document.write(res); 
    </script>

<p id="demo"></p>
<script>
    var fruits = ["Apple","Mango","Grapes","Watermelon",
    "Jack Fruit", "Banana"];
    var text = "";
    for (i =0; i < fruits.length; i++) {
        text += fruits[i] + "<br>";
    }
   document.getElementById("demo").innerHTML = text;
</script>
</body>
</html>
